<?xml version="1.0"?>
<!--
  Batamiga — EmulationStation settings seeded into
  /userdata/system/configs/emulationstation/es_settings.cfg on the first
  boot (via scripts/apply-presets.py -> datainit).

  Only non-default, project-relevant keys are set. No credentials: the
  user still enters their own ScreenScraper account in the ES menu
  (Scraper -> Settings) before the first scrape.
-->
<config>
  <!-- Scraper: ScreenScraper, the best source for Amiga media/metadata -->
  <string name="Scraper" value="ScreenScraper" />
  <bool name="ScraperOverwriteData" value="false" />
  <bool name="ScrapeRatings" value="true" />
  <bool name="ScrapeVideos" value="true" />
  <bool name="ScrapeManual" value="true" />
  <bool name="ScrapeMap" value="false" />
  <bool name="ScrapePadToKey" value="true" />
  <string name="ScreenScraperRegionPriority" value="detected" />
  <string name="ScreenScraperLanguage" value="en" />
  <string name="ScreenScraperMedia" value="mixrbv2" />
  <string name="ScreenScraperLogo" value="wheel" />
  <string name="ScreenScraperBox3D" value="box-3D" />

  <!-- Show a clean UI for a single-family system -->
  <bool name="ShowHiddenFiles" value="false" />
  <bool name="RemoveMultiDiskContent" value="true" />
  <bool name="RemoveMultiDiskContent_persistent" value="true" />
  <bool name="FavoritesFirst" value="true" />
  <string name="GamelistViewStyle" value="detailed" />

  <!-- Collections that make sense for an Amiga library -->
  <string name="CollectionSystemsCustom" value="CD32,AGA,WHDLoad,Demos" />
  <bool name="UseCustomCollectionsSystem" value="true" />
  <bool name="CollectionShowSystemInfo" value="true" />
</config>
