# Batamiga — per-system defaults appended to the datainit batocera.conf
#
# Injected at image build time by scripts/apply-presets.py into
# package/batocera/core/batocera-system/batocera.conf (datainit template).
# Applied to /userdata/system/batocera.conf on the first boot of a blank
# SHARE partition. The user can still override any of these from the
# EmulationStation menus afterwards.
#
# Keys follow Batocera's <system>.<option>=<value> convention. See
# puae.libretro.core.yml and amiberry.emulator.yml for the option lists.

# ======================================================================
# Global
# ======================================================================

## PUAE stays the default emulator/core for every Amiga system. Amiberry
## is available but must be picked explicitly (per game or per system)
## from the ES menu. Do NOT set <system>.emulator globally here, so the
## user's explicit choice always wins.

## Scraper media order: snapshot, boxart, fanart, logo, then 3D boxart.
scrapper.style=s,b,f,l,3b

## --- Network / maintenance (Phase 12) ---
## hostname stays BATOCERA (share is \\BATOCERA\share, docs assume it),
## share open on a trusted LAN, Wi-Fi off — these already are the stock
## defaults, so they are NOT repeated here (apply-presets.py comments out
## any upstream line it would otherwise duplicate).
##
## The one real change: do NOT auto-apply Batocera system upgrades — an
## upgrade regenerates es_systems.cfg and would re-expose every stock
## emulator. On this box, "update" means flashing a new Batamiga image.
updates.enabled=0

# ======================================================================
# Amiga 500 (OCS/ECS) — the classic A500 catalogue
# ======================================================================
## Model: A500, Kickstart 1.3, 512 KB Chip + 512 KB Slow — most
## compatible setup for early ADF games.
amiga500.emulator=libretro
amiga500.core=puae
amiga500.puae_model=A500
amiga500.cpu_compatibility=compatible
## One-button joystick on port 1 + mouse; second fire = up ("jump on B").
amiga500.controller1_puae=261
amiga500.controller2_puae=1
amiga500.pad_options=jump
amiga500.mouse_speed=100
## Keep borders unless a game needs them.
amiga500.zoom_mode=automatic
## Floppy at real speed (turbo can glitch some titles).
amiga500.puae_floppy_speed=100
## WHDLoad launcher enabled for pre-installed .lha/.hdf WHDLoad sets.
amiga500.whdload=config
amiga500.video_standard=PAL auto

# ======================================================================
# Amiga 1200 (AGA)
# ======================================================================
## Model: A1200, Kickstart 3.1, 2 MB Chip + 8 MB Fast.
amiga1200.emulator=libretro
amiga1200.core=puae
amiga1200.puae_model=A1200
amiga1200.cpu_compatibility=compatible
amiga1200.controller1_puae=261
amiga1200.controller2_puae=1
amiga1200.pad_options=jump
amiga1200.zoom_mode=automatic
amiga1200.puae_floppy_speed=100
amiga1200.whdload=config
amiga1200.video_standard=PAL auto

# ======================================================================
# Amiga CD32
# ======================================================================
## Model: CD32 with Fast RAM (best game compatibility), AGA + Akiko,
## Kickstart 3.1 + CD32 extended ROM.
amigacd32.emulator=libretro
amigacd32.core=puae
amigacd32.puae_model=CD32FR
## 7-button CD32 pad on port 1.
amigacd32.controller1_puae=517
amigacd32.controller2_puae=1
## Blue button behaves as a real button (no "jump on A").
amigacd32.puae_cd32pad_options=disabled
## Insert the CD during the boot animation so slow loaders don't fail.
amigacd32.puae_cd_startup_delayed_insert=enabled
## Real CD speed (turbo can break FMV/streamed audio timing).
amigacd32.puae_cd_speed=100
amigacd32.zoom_mode=automatic
amigacd32.video_standard=PAL auto
